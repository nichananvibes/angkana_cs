<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ลอยกระทง ๒๕๖๙ | เสน่ห์แห่งสายน้ำไทย</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f25;color:#fff1ce;font-family:Tahoma,sans-serif;text-align:center}header{padding:24px 12px 12px}h1{font-size:clamp(28px,5vw,52px);margin:8px;color:#ffe0a0;text-shadow:0 0 25px #b78b42}p{line-height:1.6}.eyebrow{letter-spacing:4px;color:#e6bb70;font-size:12px}.scene{position:relative;max-width:1100px;margin:auto;overflow:hidden;border:1px solid #a57e44;border-radius:20px;background:#102043}canvas{width:100%;display:block;aspect-ratio: 2/1}.scene label{position:absolute;bottom:12px;left:16px;background:#08142caa;padding:8px 15px;border-radius:20px}.panel{max-width:1100px;margin:18px auto;padding:22px;border:1px solid #725b39;border-radius:20px;background:#111c33;display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left}h2{font-size:18px;color:#f5d394;margin:0 0 12px}.choices{display:flex;flex-wrap:wrap;gap:8px}button,input,textarea{font:inherit}button{cursor:pointer;color:#ffebc3;background:#1c304b;border:1px solid #9b7b49;border-radius:12px;padding:10px 15px}button.active,button:hover{background:#eac77d;color:#17223a}input,textarea{width:100%;background:#0b1428;color:white;border:1px solid #736343;border-radius:10px;padding:12px;margin:5px 0}textarea{resize:vertical}.wide{grid-column:1/-1}.gold{background:linear-gradient(120deg,#ffe2a0,#bd842e);color:#1c2130;font-weight:bold;padding:15px 28px}.preview{font-size:48px;text-align:center;margin:8px}.message{min-height:28px;color:#ffe0a0;text-align:center}footer{padding:18px;font-size:12px;color:#c9b88f}@media(max-width:650px){.panel{grid-template-columns:1fr;margin:12px}.scene{margin:0 10px}canvas{aspect-ratio:1.2/1}}
</style></head><body><header><div class="eyebrow">✦ SIAM • FULL MOON FESTIVAL ✦</div><h1>ลอยกระทง ๒๕๖๙</h1><p>เสน่ห์แห่งสายน้ำไทย • ฝากคำอธิษฐานไว้กับแสงจันทร์</p></header><div class="scene"><canvas id="c" width="1100" height="550" aria-label="ภาพจำลองวัดไทยริมแม่น้ำยามค่ำคืน"></canvas><label id="place">วัดอรุณราชวราราม • กรุงเทพฯ</label></div><main class="panel"><section><h2>๑. เลือกสถานที่ลอยกระทง</h2><div class="choices" id="places"><button class="active" data-v="0">วัดอรุณฯ</button><button data-v="1">สุโขทัย</button><button data-v="2">ยี่เป็ง เชียงใหม่</button></div><h2 style="margin-top:20px">๒. เลือกกระทง</h2><div class="choices" id="types"><button class="active" data-v="0">🌸 บัวชมพู</button><button data-v="1">🌼 ดาวเรืองทอง</button><button data-v="2">🪷 บัวม่วง</button><button data-v="3">🤍 มะลิขาว</button><button data-v="4">🌺 กล้วยไม้</button></div><div class="preview" id="preview">🌸 🕯️</div></section><section><h2>๓. ฝากคำอธิษฐาน</h2><input id="name" maxlength="40" placeholder="ชื่อหรือนามแฝง (ไม่บังคับ)"><textarea id="wish" rows="4" maxlength="300" placeholder="ขอให้สิ่งดี ๆ ลอยเข้ามาในชีวิต..."></textarea><button id="random">✦ สุ่มคำอวยพร</button></section><section class="wide" style="text-align:center"><button class="gold" id="float">✦ ลอยกระทง ✦</button> <button id="share">แชร์เว็บไซต์</button> <button id="reset">เริ่มใหม่</button><p class="message" id="msg" role="status"></p></section></main><footer>สืบสานประเพณีไทย • ลอยกระทงออนไลน์ รักษ์สายน้ำและสิ่งแวดล้อม</footer><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),W=1100,H=550;let place=0,type=0,boats=[],fire=[];const names=['วัดอรุณราชวราราม • กรุงเทพฯ','อุทยานประวัติศาสตร์สุโขทัย','งานยี่เป็ง • เชียงใหม่'],colors=['#ff8cb8','#ffce44','#bca0ff','#fff5dd','#f66fa2'],emoji=['🌸','🌼','🪷','🤍','🌺'];const $=s=>document.querySelector(s);function poly(a,col){x.fillStyle=col;x.beginPath();a.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.closePath();x.fill()}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}const stars=Array.from({length:130},()=>[Math.random()*W,Math.random()*300,Math.random()*1.7]);function tower(a,b,s){x.save();x.translate(a,b);x.scale(s,s);for(let i=0;i<7;i++){let w=115-i*13, y=-i*28;rect(-w/2,y-28,w,29,'#97764c');rect(-w/2-5,y-5,w+10,5,'#edc680');for(let j=-w/2+8;j<w/2-3;j+=13)rect(j,y-22,4,13,'#d2ad70')}poly([[-17,-196],[0,-272],[17,-196]],'#e3bc78');x.restore()}function roof(a,b,s){x.save();x.translate(a,b);x.scale(s,s);rect(-100,-70,200,70,'#977046');for(let i=-80;i<90;i+=40)rect(i,-65,15,65,'#e8b76a');for(let i=0;i<3;i++){let w=140-i*30,y=-65-i*35;poly([[-w,y],[0,y-85],[w,y],[w-20,y+7],[0,y-57],[-w+20,y+7]],'#b46b35');poly([[-w,y],[0,y-85],[w,y],[0,y-73]],'#ffd17b')}x.restore()}function kr(a,b,s,k,t){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#3c8752';x.beginPath();x.ellipse(0,0,42,12,0,0,7);x.fill();for(let i=0;i<9;i++){let q=-36+i*9;poly([[q-7,1],[q,-20-Math.sin(i/8*Math.PI)*12],[q+7,1]],'#72b66b');circle(q,-7,7,colors[k])}rect(-2,-39,4,27,'#ffdf9b');circle(0,-43,12,'#ffce5630');circle(0,-44+Math.sin(t/120)*2,4,'#fff5b7');x.restore()}function draw(t){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#060b25');g.addColorStop(.55,'#343657');g.addColorStop(1,'#071e35');rect(0,0,W,H,g);stars.forEach(([a,b,r])=>circle(a,b,r,'#fff1c4'));let glow=x.createRadialGradient(860,105,20,860,105,110);glow.addColorStop(0,'#fff0b0aa');glow.addColorStop(1,'#fff0b000');circle(860,105,110,glow);circle(860,105,47,'#fff0bc');poly([[0,325],[0,250],[130,180],[250,270],[380,210],[540,290],[700,230],[880,270],[1100,190],[1100,325]],'#15253c');if(place===0){tower(550,320,1.05);tower(380,320,.65);tower(720,320,.65);roof(170,320,.65);roof(950,320,.7)}else if(place===1){tower(550,320,.85);tower(330,320,.55);tower(770,320,.55);rect(420,300,260,20,'#ae8553');circle(550,242,20,'#d8b17b')}else{roof(550,320,1.1);roof(240,320,.65);roof(875,320,.65);for(let i=0;i<22;i++){let a=(i*149)%W,b=30+((i*89-t*.018)%220+220)%220;rect(a,b,12,17,'#ffb75c');circle(a+6,b+16,4,'#fff2a1')}}rect(0,320,W,230,'#102b43');for(let i=0;i<80;i++){let b=330+i*2.8,a=(i*79+Math.sin(t/900+i)*35)%W;rect(a,b,30+(i%8)*9,1.5,'#cab27b45');rect(860+Math.sin(i*2+t/800)*i, b,20+i*.5,2,'#e6cf8455')}kr(140,420+Math.sin(t/600)*4,.65,1,t);kr(950,405,.6,2,t);boats.forEach(b=>{let age=(t-b.t)/1000;kr(550+Math.sin(age*.6)*45+age*12,510-Math.min(age*8,145),Math.max(.35,1-age*.035),b.k,t)});boats=boats.filter(b=>t-b.t<45000);fire=fire.filter(f=>t-f.t<1800);fire.forEach(f=>{let a=(t-f.t)/1000;for(let i=0;i<32;i++)circle(f.x+Math.cos(i/32*Math.PI*2)*a*65,f.y+Math.sin(i/32*Math.PI*2)*a*65,2,`rgba(${f.rgb},${Math.max(0,1-a/1.8)})`)});requestAnimationFrame(draw)}requestAnimationFrame(draw);setInterval(()=>{fire.push({x:100+Math.random()*650,y:50+Math.random()*95,t:performance.now(),rgb:['255,190,85','255,140,190','130,210,255'][Math.floor(Math.random()*3)]})},3000);
function choose(id,fn){$(id).addEventListener('click',e=>{if(!e.target.matches('button'))return;$(id).querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===e.target));fn(+e.target.dataset.v)})}choose('#places',v=>{place=v;$('#place').textContent=names[v];boats=[]});choose('#types',v=>{type=v;$('#preview').textContent=emoji[v]+' 🕯️'});const wishes=['ขอให้สุขภาพแข็งแรง มีความสุขในทุกวัน','ขอให้การงานราบรื่น เงินทองไหลมาเทมา','ขอให้ครอบครัวอบอุ่นและพบเจอแต่สิ่งดี ๆ','ขอให้ความฝันเป็นจริงและมีรอยยิ้มเสมอ'];$('#random').onclick=()=>$('#wish').value=wishes[Math.floor(Math.random()*wishes.length)];$('#float').onclick=()=>{let w=$('#wish').value.trim();if(!w){$('#msg').textContent='เขียนคำอธิษฐานหรือสุ่มคำอวยพรก่อนนะ';$('#wish').focus();return}boats.push({t:performance.now(),k:type});$('#msg').textContent='✨ '+($('#name').value.trim()||'คุณ')+' ลอยกระทงสำเร็จแล้ว ขอให้สมปรารถนา: '+w;for(let i=0;i<4;i++)fire.push({x:170+i*180,y:80+(i%2)*65,t:performance.now(),rgb:'255,215,120'})};$('#reset').onclick=()=>{$('#name').value='';$('#wish').value='';$('#msg').textContent='';boats=[]};$('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$('#msg').textContent='คัดลอกลิงก์แล้ว'}}catch(e){$('#msg').textContent='แชร์ได้โดยคัดลอก URL จากแถบที่อยู่'}};
</script></body></html>
